name: Tailscale Web Terminal (Root)

on:
  workflow_dispatch:

jobs:
  web-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale & Output Login Link
        run: |
          # 1. Start tailscaled daemon
          sudo tailscaled --tun=userspace-networking --socks5-server=localhost:1055 &
          sleep 3

          # 2. Authenticate node via interactive login link (No Tailscale SSH interference)
          sudo tailscale up --qr

      - name: Install and Start Root Web Terminal (ttyd on port 8080)
        run: |
          # 1. Download official ttyd binary
          sudo curl -sLo /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd

          # 2. Set root password
          echo "root:runner" | sudo chpasswd

          # 3. Start web terminal running bash directly as root
          # -W allows typing/input; drops directly into root shell
          sudo ttyd --port 8080 --credential root:runner -W /bin/bash > ttyd.log 2>&1 &
          sleep 2

          # 4. Get Tailscale IP
          TAILSCALE_IP=$(tailscale ip -4)
          WEB_URL="http://${TAILSCALE_IP}:8080"

          echo "=========================================================="
          echo "🚀 ROOT WEB TERMINAL READY!"
          echo ""
          echo "Open in your browser:"
          echo "  $WEB_URL"
          echo ""
          echo "Credentials:"
          echo "  Username: root"
          echo "  Password: runner"
          echo "=========================================================="

          # Output to GitHub Actions Job Summary
          echo "### 🌐 Root Web VPS Access" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** [$WEB_URL]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Username:** \`root\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Password:** \`runner\`" >> $GITHUB_STEP_SUMMARY

      - name: Keep Runner Alive
        run: |
          echo "Root web terminal live for 6 hours..."
          sleep 21600
